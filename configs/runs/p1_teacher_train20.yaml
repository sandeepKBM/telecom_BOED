# [telecom_boed] run config (immutable once used: add a new named config, never edit). 2026-10-31 (P0-5, NOT yet launched).
# P1 user-sim ceiling: the privileged scripted teacher (rollout/oracle_agent.py) vs the frozen 8B user on 20 train tasks.
# The agent makes no LLM calls; `llm` is the (unused) agent slot and the 8B user stays on user_simulator defaults.
# Refused under eval_final / non-train-safe tasks by register.check_oracle_allowed. Same knobs as l2x_*_train20 otherwise.
name: p1_teacher_train20
status: ready
agent: oracle-teacher
agent_kwargs: {max_reasks: 2}
user: user_simulator
domain: telecom
split: train
num_tasks: 20
num_trials: 1
seed: 300
max_steps: 200
max_concurrency: 3
max_errors: 10
llm:
  model: hosted_vllm/Qwen/Qwen3-8B
  temperature: 0.0
  extra_body: {chat_template_kwargs: {enable_thinking: false}}
boed_config: configs/boed_default.yaml
eval_final: false
