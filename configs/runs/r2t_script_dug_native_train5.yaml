# [telecom_boed] run config (immutable once used: add a new named config, never edit). 2026-11-01, pre-P3 Tests 1/2 + additions.
# Test 1: belief-driven script, myopic DUG. Same task set and knobs as l2x_*_train20 (train split order, seed 300, 1 trial, conc 3, max_steps 200); 5-task smoke.
name: r2t_script_dug_native_train5
status: ready
agent: boed-script
agent_kwargs: {scorer: dug, time_budget_ms: 2000}
user: user_simulator
domain: telecom
split: train
num_tasks: 5
num_trials: 1
seed: 300
max_steps: 200
max_concurrency: 3
max_errors: 10
llm:
  model: hosted_vllm/Qwen/Qwen3-8B
  temperature: 0.0
  extra_body: {chat_template_kwargs: {enable_thinking: false}}
boed_config: configs/boed_v2.yaml
eval_final: false
