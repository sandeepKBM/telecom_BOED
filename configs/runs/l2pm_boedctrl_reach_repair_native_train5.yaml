# [telecom_boed] run config (immutable once used: add a new named config, never edit). 2026-10-28: copy of l2pm_boedctrl_reach_native_train5 with ONLY agent_kwargs.repair_invalid_user_tools: true added (W3-F1 phone-tool repair).
# boed-controller, scorer=reach, user=user_simulator; same knobs as the W0-L1 raw smoke (5 train tasks, 1 trial, seed 300, conc 3, max_steps 200).
name: l2pm_boedctrl_reach_repair_native_train5
