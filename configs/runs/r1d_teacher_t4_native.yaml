# [telecom_boed] run config (immutable once used: add a new named config, never edit). P2 re-baseline (R1), 2026-10-31.
# r1d (2026-11-01): r1c + verify_permissions (read the app permissions back after each grant; re-grant if missing). Otherwise identical to r1c_teacher_t4_native.
# P2 arm 4: scripted oracle-teacher ceiling (no agent LLM calls), TRAIN split (74 tasks), native user, 4 trial(s). Copied from p1_teacher_train20; differs: boed_config -> boed_v2 (P0 fixes), num_trials 4; agent_kwargs max_reasks 2 kept; num_tasks 20 dropped (all 74), conc 4 as p4.
# Mix runs are derived by eval/runner.py as <name minus _native>__<persona>.yaml. Serving stays default (non-deterministic, D-a not chosen).
name: r1d_teacher_t4_native
status: ready
agent: oracle-teacher
agent_kwargs: {max_reasks: 2, stop_after_close: true, no_toggle_reask: true, verify_payment: true, verify_permissions: true}
user: user_simulator
domain: telecom
split: train
num_trials: 4
seed: 300
max_steps: 200
max_concurrency: 4
max_errors: 10
llm:
  model: hosted_vllm/Qwen/Qwen3-8B     # agent AND user
  temperature: 0.0
  extra_body: {chat_template_kwargs: {enable_thinking: false}}
boed_config: configs/boed_v2.yaml
eval_final: false
