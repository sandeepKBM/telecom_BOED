# [telecom_boed] run config (immutable once used: add a new named config, never edit).
# FROZEN test-40 baseline; reproduces the P3 run `run --domain telecom --task-split-name test --num-trials 4
# --max-concurrency 4 --max-steps 200 --seed 300` (agent+user hosted_vllm/Qwen/Qwen3-8B, T=0, enable_thinking=false).
# Needs eval_final (test split). Only for final evaluation.
name: plain_native_test40
agent: llm_agent
user: user_simulator
domain: telecom
split: test
num_trials: 4
seed: 300
max_steps: 200
max_concurrency: 4
max_errors: 10
llm:
  model: hosted_vllm/Qwen/Qwen3-8B     # agent AND user (the P3 baseline used the same model for both)
  temperature: 0.0
  extra_body: {chat_template_kwargs: {enable_thinking: false}}   # Qwen3 non-thinking (Hermes tool parser on the server)
boed_config: configs/boed_default.yaml
eval_final: true
